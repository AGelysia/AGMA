# Dependabot keeps the SHA-pinned actions, the Gradle version catalog, and the
# agent-runtime npm dependencies from silently aging. Note for Gradle updates:
# this repository verifies every dependency (gradle/verification-metadata.xml),
# and dependabot does NOT regenerate those checksums. After merging a Gradle
# dependency bump, run once locally and commit the result:
#   ./gradlew --write-verification-metadata sha256 help
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /agent-runtime
    schedule:
      interval: weekly
    groups:
      npm-production:
        dependency-type: production
      npm-development:
        dependency-type: development

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]

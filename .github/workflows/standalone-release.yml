name: Standalone Client Release

on:
  push:
    tags:
      - "standalone-v*"

permissions:
  contents: write

concurrency:
  group: standalone-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # The release check packages the standalone runtime twice to prove
      # determinism; caching the pinned Node distributions keeps each run from
      # downloading and npm-ci-ing them again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agma
          key: agma-standalone-managed-runtime-${{ hashFiles('standalone-client/managed-runtime/node-distributions.json') }}
      - name: Install release tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Verify standalone tag
        shell: bash
        run: |
          version="$(node -p "require('./standalone-client/version.json').version")"
          [[ "$GITHUB_REF_NAME" == "standalone-v$version" ]]
      - name: Build and verify standalone clients twice
        run: ./scripts/standalone-release-check.sh "$GITHUB_WORKSPACE/build/standalone-release"
      - name: Verify standalone release inventory
        shell: bash
        run: |
          version="$(node -p "require('./standalone-client/version.json').version")"
          release_directory="$GITHUB_WORKSPACE/build/standalone-release"
          [[ "$(find "$release_directory" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 10 ]]
          [[ "$(find "$release_directory" -mindepth 1 -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 8 ]]
          for target in mc1.18.2-fabric mc1.18.2-forge mc1.20.1-fabric mc1.21.11-fabric; do
            for platform in linux-x86_64 windows-x86_64; do
              test -f "$release_directory/AGMA-Client-Standalone-${version}-${target}-${platform}.jar"
            done
          done
          test -f "$release_directory/AGMA-Client-Standalone-${version}-SBOM.cdx.json"
          test -f "$release_directory/AGMA-Client-Standalone-${version}-SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-release-${{ github.sha }}
          path: build/standalone-release/
          if-no-files-found: error
          retention-days: 7

  windows-sidecar:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: standalone-release-${{ github.sha }}
          path: ${{ runner.temp }}/standalone-release
      - name: Execute embedded Windows Runtime
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring("standalone-v".Length)
          ./scripts/verify-standalone-release-windows.ps1 `
            -ReleaseDirectory "${{ runner.temp }}/standalone-release" `
            -Version $version `
            -RuntimeVersion $version `
            -NodeVersion "22.23.1"

  publish:
    needs: [build, windows-sidecar]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: standalone-release-${{ github.sha }}
          path: standalone-release
      - name: Publish standalone GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./standalone-client/version.json').version")"
          gh release create "$GITHUB_REF_NAME" \
            standalone-release/*.jar \
            standalone-release/*-SBOM.cdx.json \
            standalone-release/*-SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "AGMA Standalone Client $version"

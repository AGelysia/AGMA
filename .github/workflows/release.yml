name: Compatibility Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: compatibility-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The managed-runtime build downloads the pinned Node distribution;
      # caching it keeps release checks from re-downloading it on every tag.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agma
          key: agma-managed-runtime-${{ hashFiles('managed-runtime/node-distributions.json', 'standalone-client/managed-runtime/node-distributions.json') }}
      - name: Install release tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Verify tag
        shell: bash
        run: |
          version="$(node -p "require('./agent-runtime/package.json').version")"
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
      - name: Build and verify compatibility release
        run: ./scripts/release-check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compatibility-release-${{ github.sha }}
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./agent-runtime/package.json').version")"
          gh release create "$GITHUB_REF_NAME" \
            release/*.jar \
            release/*.zip \
            release/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "AGMA $version"

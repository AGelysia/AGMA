name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # Cancel in-flight builds for PRs only; rapid pushes to main should queue,
  # not discard, the latest verification of the branch tip.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - env:
          MINECRAFT_AGENT_VITEST_JUNIT: ${{ runner.temp }}/runtime-test-results.xml
        run: ./scripts/test.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-linux-test-results-${{ github.sha }}
          path: |
            ${{ runner.temp }}/runtime-test-results.xml
            paper-plugin/build/test-results/test/
            client-mod/build/test-results/test/
            standalone-client/core/build/test-results/test/
            standalone-client/runtime-supervisor-core/build/test-results/test/
            standalone-client/fabric-common/build/test-results/test/
            standalone-client/fabric-mc12111/build/test-results/test/
            standalone-client/fabric-mc1182/build/test-results/test/
            standalone-client/forge-mc1182/build/test-results/test/
          if-no-files-found: warn
          retention-days: 7

  integration:
    # The Paper<->Runtime integration path previously only ran at release
    # time; running the smoke suites on every main push surfaces regressions in
    # the commit that caused them instead of during a release.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # The Paper jar is pinned by PAPER_BUILD in the smoke scripts; bump this
      # cache key alongside that pin (scripts/check-versions.sh checks it).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agma-paper-smoke
          key: agma-paper-smoke-1.21.11-132
      - name: Install runtime dependencies
        working-directory: agent-runtime
        run: npm ci --prefer-offline
      - name: Dependency audit
        working-directory: agent-runtime
        run: npm audit --audit-level=high
      - name: Paper smoke test
        run: ./scripts/paper-smoke.sh
      - name: Managed runtime smoke test
        run: ./scripts/managed-paper-smoke.sh

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - shell: pwsh
        run: ./scripts/check-powershell.ps1
      - shell: pwsh
        run: ./scripts/test.ps1
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-windows-test-results-${{ github.sha }}
          path: |
            paper-plugin/build/test-results/test/
            client-mod/build/test-results/test/
            standalone-client/core/build/test-results/test/
            standalone-client/runtime-supervisor-core/build/test-results/test/
            standalone-client/fabric-common/build/test-results/test/
            standalone-client/fabric-mc12111/build/test-results/test/
            standalone-client/fabric-mc1182/build/test-results/test/
            standalone-client/forge-mc1182/build/test-results/test/
          if-no-files-found: warn
          retention-days: 7
